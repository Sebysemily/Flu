# -----------------------------
# Reproducibility and resources
# -----------------------------
random_seed: 39809473   # Base seed reused across steps that require randomization, to ensure reproducibility.
max_threads: 16         # Default thread cap 

# -----------------------------
# treetime prunning values
# -----------------------------
treetime_parameters:
  clock_filter: 4.0   # Outlier detection threshold (number of interquartile ranges from regression)
# -----------------------------
# ML_parameters

# Outgroup root sample
outgroup_root_sample: "EPI_ISL_18133029" #muestra mas antigua para root
# -----------------------------
# BEAST parameters
# -----------------------------
beast:
  # One BEAST process ≈ one CPU core. Run 2 chains in parallel on a 16-core box (~25% total CPU is normal).
  threads_per_chain: 1
  max_parallel_chains: 3
  models:
    strict_const: { chainLength: 50000000, logEvery: 5000 }
    strict_exp: { chainLength: 50000000, logEvery: 5000 }
    strict_bay: { chainLength: 50000000, logEvery: 5000 }
    ucln_const: { chainLength: 50000000, logEvery: 5000 }
    ucln_exp: { chainLength: 50000000, logEvery: 5000 }
    ucln_bay: { chainLength: 50000000, logEvery: 5000 }
